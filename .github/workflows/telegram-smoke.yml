name: Telegram phone smoke test

on:
  push:
    branches: [dev/mytgbot-v2]
    paths:
      - .github/workflows/telegram-smoke.yml
      - .telegram-smoke-trigger

permissions:
  contents: read

concurrency:
  group: telegram-phone-smoke
  cancel-in-progress: true

jobs:
  temporary-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.TEST_TELEGRAM_ADMIN_IDS }}
      ENGINEER_CODE: ${{ secrets.TEST_ENGINEER_CODE }}
      DATABASE_URL: sqlite:///data/telegram_smoke.db
      DATA_DIR: data
      TEMPLATES_DIR: templates
      LOG_FILE: ""
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Check test token secret
        id: secret
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "TEST_TELEGRAM_BOT_TOKEN is not configured; temporary bot was not started."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.secret.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.secret.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt

      - name: Check configuration
        if: steps.secret.outputs.ready == 'true'
        run: python manage.py check

      - name: Run temporary bot for 20 minutes
        if: steps.secret.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=20s 20m python manage.py run
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 130 ]; then
            echo "Temporary Telegram test window completed normally."
            exit 0
          fi
          exit "$status"
